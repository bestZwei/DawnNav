services:
  # Next.js 应用（SQLite 单文件数据库：零外部依赖，数据持久化在 nav-data 卷）
  nav:
    # 本仓库 CI（.github/workflows/docker-publish.yml）按仓库名构建的镜像
    image: ghcr.io/bestzwei/dawnnav:latest
    container_name: nav
    restart: unless-stopped
    ports:
      - ${PORT:-3000}:3000
    environment:
      # SQLite 数据文件（挂载 nav-data 卷持久化）
      SQLITE_PATH: /app/data/nav.db
      # 会话签名密钥，未设置时回退 NEXTAUTH_SECRET
      SESSION_SECRET: ${SESSION_SECRET:-${NEXTAUTH_SECRET}}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # 初始管理员账号（仅首次 seed 生效；已运行实例上后补设置也会在启动时对齐创建）：
      # compose 的 .env 只做变量替换，不注入容器环境，必须显式透传才能被容器内脚本读到
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # JSON 导入文件大小上限（MB），默认 10；大数据量备份导入可放宽，如 MAX_IMPORT_MB=200
      MAX_IMPORT_MB: ${MAX_IMPORT_MB:-10}
      NODE_ENV: production
    volumes:
      # SQLite 数据库持久化：全部业务数据都在这里（备份即备份该卷）
      - nav-data:/app/data
      # 会话密钥兜底文件持久化：未配置 SESSION_SECRET 时，重启/换镜像不会导致全部会话失效
      - nav-session-data:/app/.session-data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  # 显式固定卷名：不随 compose 项目名（目录名）变化，备份/恢复命令可直接引用
  nav-data:
    driver: local
    name: nav-data
  nav-session-data:
    driver: local
    name: nav-session-data
